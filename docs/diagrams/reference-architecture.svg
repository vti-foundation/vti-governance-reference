<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">VTI Deterministic Governance Reference Architecture</title>
  <desc id="desc">Flow from proposed action through governance inputs, authority-state interface, deterministic evaluation, decision artifact, infrastructure adapter, and external systems.</desc>

  <style>
    .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 18px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Arial, sans-serif; font-size: 16px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #222222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>

  <rect class="box" x="300" y="40" width="300" height="60"/>
  <text class="text" x="450" y="70">Proposed Action</text>

  <line class="line" x1="450" y1="100" x2="450" y2="135"/>

  <rect class="box" x="300" y="135" width="300" height="60"/>
  <text class="text" x="450" y="165">Governance Inputs</text>

  <line class="line" x1="450" y1="195" x2="450" y2="230"/>

  <rect class="box" x="300" y="230" width="300" height="60"/>
  <text class="text" x="450" y="260">Authority-State Interface</text>

  <line class="line" x1="450" y1="290" x2="450" y2="325"/>

  <rect class="box" x="275" y="325" width="350" height="60"/>
  <text class="text" x="450" y="355">Deterministic Evaluation Boundary</text>

  <line class="line" x1="450" y1="385" x2="450" y2="420"/>

  <rect class="box" x="300" y="420" width="300" height="60"/>
  <text class="text" x="450" y="450">Decision Artifact</text>

  <line class="line" x1="450" y1="480" x2="450" y2="515"/>

  <rect class="box" x="300" y="515" width="300" height="60"/>
  <text class="text" x="450" y="545">Infrastructure Adapter</text>

  <line class="line" x1="450" y1="575" x2="450" y2="610"/>
  <line x1="150" y1="610" x2="750" y2="610" stroke="#222222" stroke-width="2"/>

  <line class="line" x1="150" y1="610" x2="150" y2="645"/>
  <line class="line" x1="450" y1="610" x2="450" y2="645"/>
  <line class="line" x1="750" y1="610" x2="750" y2="645"/>

  <rect class="box" x="40" y="645" width="220" height="60"/>
  <text class="small" x="150" y="675">Blockchain / DLT</text>

  <rect class="box" x="340" y="645" width="220" height="60"/>
  <text class="small" x="450" y="675">API / Application</text>

  <rect class="box" x="640" y="645" width="220" height="60"/>
  <text class="small" x="750" y="675">Enterprise / Legacy</text>
</svg>
